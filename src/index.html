<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заказ пиццы</title>
    <link rel="stylesheet" href="assets/styles/style.css">
    <script src="index.js"></script>
</head>

<body>
    <div class="container">
        <div class="left-column">
            <div class="grid pizza-selection">
                <div class="pizza-item" onclick="selectPizza('Пепперони')" data-type="Пепперони">
                    <img src="assets/img/pepperoni.avif" alt="Пепперони">
                    <p>Пепперони</p>
                </div>
                <div class="pizza-item" onclick="selectPizza('Маргарита')" data-type="Маргарита">
                    <img src="assets/img/margarita.avif" alt="Маргарита">
                    <p>Маргарита</p>
                </div>
                <div class="pizza-item" onclick="selectPizza('Баварская')" data-type="Баварская">
                    <img src="assets/img/bavarskaya.avif" alt="Баварская">
                    <p>Баварская</p>
                </div>
            </div>

            <input type="hidden" id="pizzaType" value="Маргарита">
        </div>
        <div class="right-column">
            <h2>Выберите размер</h2>
            <div class="toggle-container">
                <span>Маленькая</span>
                <label class="toggle">
                    <input type="checkbox" id="sizeToggle" onchange="toggleSize()">
                    <span class="slider"></span>
                </label>
                <span>Большая</span>
            </div>

            <h2>Дополнительные ингредиенты</h2>
            <div class="grid toppings-selection">
                <div class="topping-item" onclick="toggleTopping('mozzarella')">
                    <img src="assets/img/Moz.png" alt="Моцарелла">
                    <p>Моцарелла</p>
                </div>
                <div class="topping-item" onclick="toggleTopping('cheeseBorder')">
                    <img src="assets/img/bort.png" alt="Сырный бортик">
                    <p>Сырный бортик</p>
                </div>
                <div class="topping-item" onclick="toggleTopping('cheddarParmesan')">
                    <img src="assets/img/parm.png" alt="Чеддер и пармезан">
                    <p>Чеддер и пармезан</p>
                </div>
            </div>

            <button id="orderButton" onclick="calculatePizza()" class="disabled">Выберите пиццу и ингредиенты</button>

            <div id="result"></div>
        </div>
    </div>
</body>

</html>
